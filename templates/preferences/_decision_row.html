<article class="card min-w-0" data-decision="{{ row.item.id }}" aria-labelledby="decision-title-{{ row.item.id }}">
    <h2 id="decision-title-{{ row.item.id }}" class="break-words font-bold">{{ row.item.product_name }}</h2>
    <p class="mt-1 break-words text-sm text-muted">{{ row.item.shelf_name }} · <time datetime="{{ row.item.created_at }}">{{ row.created_at|date:"d M Y, H:i" }}</time></p>
    <form method="post" action="{% url 'preferences:decision_update' row.item.id %}" data-decision-update class="mt-4 space-y-2">
        {% csrf_token %}
        <label for="note-{{ row.item.id }}" class="block text-sm font-semibold">Alasan (opsional)</label>
        <textarea name="note" id="note-{{ row.item.id }}" maxlength="500" rows="2" class="w-full min-w-0 rounded-xl border border-line p-3 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">{{ row.item.note }}</textarea>
        <button type="submit" id="update-decision-{{ row.item.id }}" class="btn-brand btn-small min-h-11 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">Simpan alasan</button>
    </form>
    <form method="post" action="{% url 'preferences:decision_delete' row.item.id %}" data-decision-delete class="mt-3">
        {% csrf_token %}<button type="submit" id="delete-decision-{{ row.item.id }}" class="btn-white btn-small min-h-11 ring-1 ring-line focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">Hapus keputusan</button>
    </form>
</article>
