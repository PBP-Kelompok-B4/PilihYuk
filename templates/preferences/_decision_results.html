{% for row in rows %}{% include "preferences/_decision_row.html" %}
{% empty %}<p class="card">Belum ada keputusan yang cocok.</p>{% endfor %}
<nav aria-label="Halaman riwayat" class="flex flex-wrap items-center gap-4">
    {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}" class="text-brand underline" data-page>Sebelumnya</a>{% endif %}
    <span class="text-sm">Halaman {{ page_obj.number }} dari {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}" class="text-brand underline" data-page>Berikutnya</a>{% endif %}
</nav>
