<section class="card min-w-0" data-nutrient="{{ row.nutrient }}" data-id="{{ row.item.pk|default:'' }}" data-direction="{{ row.direction }}" data-weight="{{ row.weight }}" aria-labelledby="label-{{ row.nutrient }}">
    <div class="grid min-w-0 grid-cols-[minmax(0,1fr)_auto] items-center gap-4 lg:grid-cols-[minmax(0,1fr)_auto_auto_auto_auto]">
        <h2 id="label-{{ row.nutrient }}" class="col-start-1 row-start-1 break-words font-bold">{{ row.label }}</h2>
        <form method="post" action="{% if row.active %}{% url 'preferences:preference_update' row.item.pk %}{% else %}{% url 'preferences:preference_create' %}{% endif %}" class="contents" data-preference-save>
            {% csrf_token %}<input type="hidden" name="nutrient" value="{{ row.nutrient }}">
            <fieldset {% if not row.active %}disabled{% endif %} class="col-span-2 min-w-0 lg:col-span-1 lg:col-start-2 lg:row-start-1" data-setting>
                <legend class="mb-1 text-xs text-muted">Bobot {{ row.label }}</legend>
                <div class="inline-flex max-w-full rounded-xl bg-surface p-1">
                {% for value,label in weight_choices %}
                    <label class="inline-flex min-h-11 cursor-pointer items-center rounded-lg px-3 py-2 text-sm has-checked:bg-brand has-checked:text-white has-disabled:cursor-not-allowed has-disabled:opacity-50 has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-brand">
                        <input type="radio" id="weight-{{ row.nutrient }}-{{ value }}" name="weight" value="{{ value }}" {% if row.weight == value %}checked{% endif %} class="sr-only">{{ label }}
                    </label>
                {% endfor %}
                </div>
            </fieldset>
            <div class="col-span-2 min-w-0 sm:col-span-1 lg:col-start-3 lg:row-start-1">
                <label for="direction-{{ row.nutrient }}" class="mb-1 block text-xs text-muted">Arah {{ row.label }}</label>
                <select name="direction" id="direction-{{ row.nutrient }}" {% if not row.active %}disabled{% endif %} data-setting class="min-h-11 w-full max-w-full rounded-xl border border-line bg-white p-3 text-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand disabled:opacity-50">
                {% for value,label in direction_choices %}<option value="{{ value }}" {% if row.direction == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
                </select>
            </div>
            {% if row.active %}<button type="submit" id="save-{{ row.nutrient }}" class="btn-brand btn-small min-h-11 justify-self-start focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand lg:col-start-4 lg:row-start-1" data-save-button>Simpan</button>{% endif %}
        </form>
        <form method="post" action="{% if row.active %}{% url 'preferences:preference_delete' row.item.pk %}{% else %}{% url 'preferences:preference_create' %}{% endif %}" class="col-start-2 row-start-1 justify-self-end lg:col-start-5" data-preference-toggle>
            {% csrf_token %}<input type="hidden" name="nutrient" value="{{ row.nutrient }}">
            <input type="hidden" name="direction" value="{{ row.direction }}"><input type="hidden" name="weight" value="2">
            <button type="submit" id="active-{{ row.nutrient }}" role="switch" aria-checked="{% if row.active %}true{% else %}false{% endif %}" aria-label="Aktifkan {{ row.label }}" class="btn-white btn-small min-h-11 ring-1 ring-line focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">
                <span aria-hidden="true" class="inline-flex h-5 w-9 shrink-0 items-center rounded-full p-0.5 {% if row.active %}bg-brand{% else %}bg-track{% endif %}"><span class="h-4 w-4 rounded-full bg-white {% if row.active %}translate-x-4{% endif %}"></span></span>
                {% if row.active %}Aktif{% else %}Nonaktif{% endif %}
            </button>
        </form>
    </div>
    <div data-preview class="mt-3 break-words text-sm text-muted" aria-live="polite"></div>
</section>
