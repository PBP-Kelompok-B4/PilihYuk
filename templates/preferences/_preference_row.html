{% load static %}
<div class="grid min-w-0 grid-cols-[minmax(0,1fr)_44px] items-center gap-3 py-5 lg:grid-cols-[minmax(90px,1fr)_170px_170px_44px]" data-nutrient="{{ row.nutrient }}" data-direction="{{ row.direction }}" data-default-direction="{{ row.default_direction }}" data-weight="{{ row.weight }}">
    <h3 class="col-start-1 row-start-1 flex min-w-0 items-center gap-2 text-sm font-bold"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-mint"><img src="{% static 'img/leaf.svg' %}" alt="" class="h-4 w-4"></span>{{ row.label }}</h3>
    <fieldset {% if not row.active %}disabled{% endif %} data-draft-control class="col-span-2 min-w-0 lg:col-span-1 lg:col-start-2 lg:row-start-1"><legend class="sr-only">Arah {{ row.label }}</legend><div class="inline-flex max-w-full rounded-lg bg-surface p-1">
    {% for value,label in direction_choices %}<label class="inline-flex min-h-11 cursor-pointer items-center rounded-md px-2 text-[11px] has-checked:bg-white has-checked:font-bold has-disabled:cursor-not-allowed has-disabled:opacity-50 has-focus-visible:outline-2 has-focus-visible:outline-brand"><input class="sr-only" type="radio" name="direction-{{ row.nutrient }}" id="direction-{{ row.nutrient }}-{{ value }}" data-direction-input value="{{ value }}" {% if row.direction == value %}checked{% endif %}>{{ label }}</label>{% endfor %}
    </div></fieldset>
    <fieldset {% if not row.active %}disabled{% endif %} data-draft-control class="col-span-2 min-w-0 lg:col-span-1 lg:col-start-3 lg:row-start-1"><legend class="sr-only">Bobot {{ row.label }}</legend><div class="inline-flex max-w-full rounded-lg bg-surface p-1">
    {% for value,label in weight_choices %}<label class="inline-flex min-h-11 cursor-pointer items-center rounded-md px-2 text-[11px] has-checked:bg-white has-checked:font-bold has-disabled:cursor-not-allowed has-disabled:opacity-50 has-focus-visible:outline-2 has-focus-visible:outline-brand"><input class="sr-only" type="radio" name="weight-{{ row.nutrient }}" id="weight-{{ row.nutrient }}-{{ value }}" data-weight-input value="{{ value }}" {% if row.weight == value %}checked{% endif %}>{{ label }}</label>{% endfor %}
    </div></fieldset>
    <button type="button" id="active-{{ row.nutrient }}" data-draft-toggle role="switch" aria-checked="{% if row.active %}true{% else %}false{% endif %}" aria-label="Aktifkan {{ row.label }}" class="col-start-2 row-start-1 flex min-h-11 items-center justify-center rounded-lg focus-visible:outline-2 focus-visible:outline-brand lg:col-start-4"><span data-toggle-track aria-hidden="true" class="inline-flex h-6 w-10 items-center rounded-full p-1 {% if row.active %}bg-brand{% else %}bg-track{% endif %}"><span data-toggle-thumb class="h-4 w-4 rounded-full bg-white {% if row.active %}translate-x-4{% endif %}"></span></span></button>
</div>
