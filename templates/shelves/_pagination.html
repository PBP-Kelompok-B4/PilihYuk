{% if page.paginator.num_pages > 1 %}
<nav class="mt-8 flex items-center justify-center gap-3 text-sm">
    {% if page.has_previous %}<a href="?{{ param|default:'page' }}={{ page.previous_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}" class="btn-white btn-small">Sebelumnya</a>{% endif %}
    <span class="text-muted">Halaman {{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a href="?{{ param|default:'page' }}={{ page.next_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}" class="btn-white btn-small">Berikutnya</a>{% endif %}
</nav>
{% endif %}
