{% if page.paginator.num_pages > 1 %}
<nav aria-label="Halaman" class="mt-8 flex flex-wrap items-center justify-center gap-2">
    {% if page.has_previous %}<a href="{% if param == 'saved_page' %}{% querystring saved_page=page.previous_page_number %}{% else %}{% querystring page=page.previous_page_number %}{% endif %}" class="nav-chip">Sebelumnya</a>{% endif %}
    <span class="nav-chip" aria-current="page">Halaman {{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a href="{% if param == 'saved_page' %}{% querystring saved_page=page.next_page_number %}{% else %}{% querystring page=page.next_page_number %}{% endif %}" class="nav-chip">Berikutnya</a>{% endif %}
</nav>
{% endif %}
