<div class="mt-4">
    {% if field.widget_type == 'checkbox' %}
    <label for="{{ field.id_for_label }}" class="flex items-start gap-2.5 text-[13px] leading-snug text-muted">
        {{ field }}<span>{{ field.label }}</span>
    </label>
    {% else %}
    <label for="{{ field.id_for_label }}" class="mb-1.5 block text-[13px] font-semibold">{{ field.label }}</label>
    <div class="relative">
        {{ field }}
        {% if field.widget_type == 'password' %}
        <button type="button" data-toggle-password="{{ field.id_for_label }}" aria-pressed="false"
                class="absolute inset-y-0 right-0 px-3 text-xs font-semibold text-muted hover:text-brand">Tampilkan</button>
        {% endif %}
    </div>
    {% endif %}
    {% if field.help_text and field.widget_type != 'checkbox' %}<div class="mt-1.5 text-xs text-muted">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<p role="alert" class="mt-1.5 text-xs font-semibold text-[#b42318]">{{ error }}</p>{% endfor %}
</div>
